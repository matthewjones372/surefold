name: benchmarks

# The stream modules measured on the base branch and on the pull request, in alternating rounds on one runner, and
# red when a row got slower (bench/surefold-stream-benchmarks/gate.sh). A committed number was measured on some other
# machine, so the gate compares only what it measured itself.
#
# It takes half an hour, so it runs only on a pull request labelled `benchmarks`, on each push to it after
# that, or from Run workflow.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      base:
        description: "Branch to compare against; this branch itself measures the gate's own noise"
        default: main
      benchmarks:
        description: "Only the benchmarks matching this JMH pattern; empty for all of them"
        default: ""

permissions:
  contents: read

jobs:
  gate:
    # Any other label added to a labelled pull request is not a reason to measure it again.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'benchmarks') &&
       (github.event.action != 'labeled' || github.event.label.name == 'benchmarks'))
    # On the job, not the workflow: a skipped run must not cancel the one measuring.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          # The base branch has to be there for gate.sh to put it in a worktree beside this checkout.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Benchmarks on the base and on this change
        # Inputs reach the script as variables, so nothing typed into Run workflow is read as shell.
        env:
          BASE: ${{ github.base_ref || inputs.base || 'main' }}
          BENCHMARKS: ${{ inputs.benchmarks }}
        run: bench/surefold-stream-benchmarks/gate.sh "origin/$BASE" "$BENCHMARKS"

      # Where each benchmark's time went, drawn: the diagrams to read when the gate goes red.
      - name: Profile each benchmark's pipeline
        if: always()
        run: ./gradlew --quiet :surefold-stream-benchmarks:profiles

      # Every run's rows, so drift shows up in the history before it trips the gate.
      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-compare
          path: |
            bench/surefold-stream-benchmarks/build/jmh-compare.txt
            bench/surefold-stream-benchmarks/build/rounds/
            bench/surefold-stream-benchmarks/build/profiles/
          retention-days: 90
