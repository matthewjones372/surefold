# A tag is what cuts a release, and this is what a tag does. Publishing from a
# laptop is how 0.1.0 went out with a version nobody had agreed on.
name: release

on:
  push:
    # A pre-release tag is not a release: a candidate is a snapshot, which
    # snapshot.yml publishes, rather than a version on Central for good.
    tags: ["v*", "!v*-*"]
  # A dispatch with a version cuts that release from a commit on main: this
  # workflow tags it, so nobody has to push a tag from a laptop (and a session
  # that cannot push tags can still release). A tag pushed by the workflow's own
  # token would not start another workflow, which is why the tagging happens
  # here rather than in a workflow of its own. Without a version, a dispatch
  # re-runs the release of the tag it was dispatched on.
  workflow_dispatch:
    inputs:
      version:
        description: "Release to cut, e.g. 0.18.1. Tags v<version> on `commit`. Empty: release the dispatched tag."
        type: string
        default: ""
      commit:
        description: "Commit on main to tag. Empty: the head of main."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    # To push the tag this run creates, at the end and only once Central has the
    # release. Nothing else here writes to the repository.
    permissions:
      contents: write
    # On the job rather than on the publish step: a tag gives axion a version with
    # no `-SNAPSHOT`, which is what makes Gradle's signing required, and `build`
    # signs the publications before anything is published. A PR never noticed
    # because a snapshot is signed by nobody and the task simply skips.
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # axion reads the tag to decide the version, and a shallow clone has none.
          fetch-depth: 0
          ref: ${{ inputs.version != '' && (inputs.commit || 'main') || '' }}

      # Local first, so axion reads the release version for the build and the
      # publish below; pushed in the last step, once the publish has succeeded,
      # so a failed build leaves no tag behind. A tag that already exists on the
      # same commit is a re-run and is reused; on another commit it is refused.
      - name: Tag the release
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            *[!0-9.]*|.*|*.|*..*) echo "$VERSION is not a release version (X.Y.Z)"; exit 1 ;;
          esac
          [ "$(echo "$VERSION" | tr -cd . | wc -c)" = 2 ] || { echo "$VERSION is not X.Y.Z"; exit 1; }
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" origin/main || { echo "$commit is not on main"; exit 1; }
          tag="v$VERSION"
          if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            [ "$existing" = "$commit" ] || { echo "$tag already tags $existing, not $commit"; exit 1; }
            echo "$tag already tags $commit"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "$tag" "$commit" -m "surefold $VERSION"
            echo "tagged $commit as $tag"
          fi

      # 27 for surefold-structured's toolchain, installed rather than left to Gradle, whose download of
      # 27 is an Alpine build that does not run here; 25, listed last, is what Gradle runs on.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            25

      - uses: gradle/actions/setup-gradle@v4

      # The gates first. A release that has not passed them is a release nobody
      # can withdraw. Two workers, as build.yml runs them: with every module's tests
      # at once, the cluster tests' timeouts fire and the daemon runs out of memory,
      # which is how v0.10.1 and v0.11.0 failed where main's build had passed.
      - run: ./gradlew build --max-workers=2 --stacktrace

      # The last non-blank line's last word: `currentVersion` prints a banner too, and a
      # multi-line value is one GITHUB_OUTPUT refuses rather than truncates.
      - id: version
        run: echo "value=$(./gradlew -q currentVersion | awk 'NF { last = $NF } END { print last }')" >> "$GITHUB_OUTPUT"

      # The tag filter keeps a candidate out on a push; a dispatch has no filter,
      # and one from a branch or a candidate tag would publish a version that is
      # not a release.
      - name: Refuse anything but a release
        run: |
          version="${{ steps.version.outputs.value }}"
          case "$version" in
            "") echo "could not read the version"; exit 1 ;;
            *-*) echo "$version is not a release; snapshot.yml publishes candidates"; exit 1 ;;
          esac
          if [ -n "$ASKED" ] && [ "$version" != "$ASKED" ]; then
            echo "asked to release $ASKED, but the build reads $version"; exit 1
          fi
        env:
          ASKED: ${{ inputs.version }}

      # A tag can be re-run, and Central refuses a version it already has — with a
      # message about the upload rather than about the re-run. Saying so here is
      # the difference between a red job somebody has to read and a green one.
      - id: already
        run: |
          version="${{ steps.version.outputs.value }}"
          on_central() {
            url="https://repo1.maven.org/maven2/$1/surefold/$version/surefold-$version.pom"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            [ "$code" = "200" ] && echo yes || echo no
          }
          released=$(on_central dev/surefold)
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "$version under dev.surefold on Central: $released"

      # Every module's javadoc jar, six modules to a Gradle run. Dokka's worker
      # process keeps the classes of each module it renders, so one run rendering
      # all of them grew past the 8 GB of the runner it then had and had the daemon killed
      # mid-publish, which is how v0.11.0 and v0.12.0 failed after their builds
      # had passed. A run of its own ends its workers; the publish below then finds
      # every javadoc up to date.
      - if: steps.already.outputs.released != 'yes'
        name: Javadoc, six modules at a time
        run: |
          ./gradlew --stop
          tasks=$(./gradlew --no-daemon -q tasks --all | grep -oE '^[a-z0-9-]+:dokkaGeneratePublicationHtml' | sort -u | sed 's/^/:/')
          echo "$tasks" | xargs -n 6 ./gradlew --no-daemon --max-workers=2

      # Staged rather than released: the Portal is where somebody looks at what
      # is about to become permanent and presses the button.
      #
      # dev.surefold only. The relocation POMs at io.github.matthewjones372 (spec 0277) were
      # one release, 0.18.0, and that release already points every module at dev.surefold.
      - if: steps.already.outputs.released != 'yes'
        name: dev.surefold to Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache --max-workers=2

      # Last, and only once the deployment is staged: the tag is the record
      # of what was released. A dispatch without a version ran on a tag that is
      # already pushed.
      - name: Push the tag
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: git push origin "refs/tags/v$VERSION"
