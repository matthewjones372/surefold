name: snapshot

# What a release candidate used to be for: something to try before it is a
# release. A candidate tag put every module on Central for good and counted
# against the Portal's monthly limits; a snapshot goes to Central's snapshot
# repository, which drops it after 90 days. Dispatched by hand, from the branch
# whose next version should be tried, rather than on every push: whether
# snapshots count against the limits is something the Portal does not say.
#
# Consumers add https://central.sonatype.com/repository/maven-snapshots/ and
# depend on the version this prints, e.g. `1.2.1-SNAPSHOT`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest

    # No signing key: a snapshot does not have to be signed, and a job that does
    # not hold the key cannot sign a release by mistake.
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The version is derived from the nearest `v` tag, and a shallow
          # checkout has no tags to derive it from.
          fetch-depth: 0

      # The same two as release.yml: 27 for surefold-structured's toolchain, 25 for Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            25

      - uses: gradle/actions/setup-gradle@v4

      # Dispatched on a tag, axion would give a release version, and the plugin
      # would stage it for Central rather than send it to the snapshot repository.
      - name: Refuse anything but a snapshot
        run: |
          version=$(./gradlew -q currentVersion | awk 'NF { last = $NF } END { print last }')
          echo "version: $version"
          case "$version" in
            *-SNAPSHOT) ;;
            *) echo "$version is not a snapshot; dispatch this from a branch"; exit 1 ;;
          esac

      - run: ./gradlew build

      - run: ./gradlew publishToMavenCentral --no-configuration-cache
