name: snapshot

# A snapshot of every push to main, and of a branch when dispatched from it, on
# GitHub Packages (spec 0281): https://maven.pkg.github.com/surefold/surefold-core.
# It does not expire, unlike Central's snapshot repository, so a version pinned
# in a handoff keeps resolving. Releases stay on Central (release.yml).
#
# Consumers add that repository with a classic personal access token holding
# only read:packages, since GitHub Packages asks for one even to read a public
# package, and depend on the version this prints, e.g. `1.2.1-SNAPSHOT`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One publish at a time, in push order: a later snapshot never lands under an earlier one.
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04

    # No signing key: a snapshot does not have to be signed, and a job that does
    # not hold the key cannot sign a release by mistake. The token is the
    # workflow's own, which can write this repository's packages and no others.
    env:
      ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The version is derived from the nearest `v` tag, and a shallow
          # checkout has no tags to derive it from.
          fetch-depth: 0

      # The same two as release.yml: 27 for surefold-structured's toolchain, 25 for Gradle.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            27
            25

      - uses: gradle/actions/setup-gradle@v6

      # On a tagged commit axion gives a release version, which is release.yml's
      # to publish. A push of one is skipped; a dispatch of one is a mistake.
      - name: Only a snapshot
        id: version
        run: |
          version=$(./gradlew -q currentVersion | awk 'NF { last = $NF } END { print last }')
          echo "version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-SNAPSHOT) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                 echo "$version is not a snapshot; dispatch this from a branch"; exit 1
               fi
               echo "$version is a release; release.yml publishes it" ;;
          esac

      # A push to main has already passed the pull request's build, so this
      # publishes without running the tests again.
      - if: steps.version.outputs.publish == 'true'
        run: ./gradlew publishAllPublicationsToGithubPackagesRepository --no-configuration-cache

      # surefold-integrations and surefold-platform test on core's fixtures (spec 0301): a build outside this one
      # resolves them from GitHub Packages, as theirs will, so a snapshot that dropped one fails here, not there.
      - if: steps.version.outputs.publish == 'true'
        run: >
          ./gradlew -p .github/consumers/test-fixtures checkFixtures
          -PsurefoldRepo=https://maven.pkg.github.com/surefold/surefold-core
          -PsurefoldVersion=${{ steps.version.outputs.version }}
