name: build

on:
  # main only: a branch with a pull request open is already built by the
  # pull_request event, and building it twice buys nothing.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going supersedes it. The
# earlier answer is about code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # GitHub's runners, which cost nothing for a public repository, for every build, a fork's included.
    runs-on: ubuntu-24.04
    # A backstop behind the step's own limit below, for a hang outside it. GitHub's default is six hours.
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        # 25 is the toolchain and the floor: the first LTS where `synchronized` no longer pins a virtual
        # thread's carrier, which a JDK 21 deadlock under load made a requirement. The Gradle plugin and
        # the compiler plugin still compile for 21, as they run inside the build tools.
        include:
          - java: "25"
            gradleArgs: ""

    steps:
      # The merge commit and the base under it, so the build step can see what a pull request changed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # 27 as well as the matrix JDK: surefold-structured compiles against 27's StructuredTaskScope, and
      # Gradle finds an installed JDK before it downloads one. Its own download picks foojay's
      # Alpine build of 27, which does not run on this glibc runner. The last version listed is the
      # one JAVA_HOME points at, so Gradle itself still runs on the matrix JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            27
            ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      # A green build takes under ten minutes. The limit is on the step rather than the job, so the reports
      # below are still uploaded when it is hit. Two workers, not one per core: four at once (test JVMs of up
      # to 2 GB, TestKit's own Gradle, the Kotlin daemon beside Gradle's) got the daemon OOM-killed on a
      # build with nothing cached, on the 8 GB machine this used to run on. GitHub's has 16 GB; the limit
      # stays until a build shows four fit.
      # A pull request builds what it affects: the modules it changes, everything that depends on them, and
      # surefold-app's repository-wide suites, or SpecsSuite alone when it changes only specs/.
      # .github/affected-tasks.sh says which, and answers the whole build for a change to the build itself. A pull
      # request's checkout is GitHub's merge commit, so its first parent is the base. A push to main and a manual
      # run build everything, the coverage floor across every module included, so nothing a pull request skipped
      # reaches a release unchecked.
      - name: Build and test
        timeout-minutes: 25
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -f
          if [ "$EVENT" = pull_request ]; then
            tasks=$(.github/affected-tasks.sh HEAD^1)
          else
            tasks=build
          fi
          echo "Building: $tasks"
          ./gradlew $tasks ${{ matrix.gradleArgs }} --max-workers=2 --stacktrace

      # The suites run an Api in memory and assert on which thread a body ran
      # on, so a failure is worth reading rather than guessing at.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
